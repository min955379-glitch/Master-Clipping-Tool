[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "all-in-one-ai-video-clipping-studio"
version = "0.1.0"
description = "Local-first AI video clipping studio"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.4",
    "httpx==0.28.1",
    "python-multipart==0.0.34",
    "python-dotenv==1.2.4",
    "yt-dlp==2026.10.26",
    "numpy==1.26.4",
    "opencv-python-headless==4.11.0.86",
    "mediapipe==0.10.21",
    "faster-whisper==1.2.1",
    "mcp==2.3.0",
]

[project.scripts]
frameforge = "core.cli:main"
frameforge-mcp = "core.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
